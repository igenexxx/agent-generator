<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKF Knowledge Visualizer</title>
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Cytoscape.js & Marked.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            
            /* Node type colors */
            --color-dataset: #4ade80;
            --color-table: #38bdf8;
            --color-metric: #a855f7;
            --color-reference: #fb7185;
            --color-default: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Glassmorphic Side Panel */
        #sidebar {
            width: 450px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        #graph-container {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        /* Search & Filter Header */
        .header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Detail Panel Content */
        .detail-content {
            margin-top: 16px;
        }

        .meta-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .badge-dataset { background: rgba(74, 222, 128, 0.2); color: var(--color-dataset); }
        .badge-table { background: rgba(56, 189, 248, 0.2); color: var(--color-table); }
        .badge-metric { background: rgba(168, 85, 247, 0.2); color: var(--color-metric); }
        .badge-reference { background: rgba(251, 113, 133, 0.2); color: var(--color-reference); }

        .concept-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .concept-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* Markdown Body Styling */
        .markdown-body {
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .markdown-body p {
            margin-bottom: 16px;
        }

        .markdown-body h2 {
            font-size: 18px;
            margin: 24px 0 12px 0;
            color: var(--text-color);
        }

        .markdown-body a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-color);
        }

        .markdown-body a:hover {
            color: #f8fafc;
            border-bottom-style: solid;
        }

        .markdown-body ul, .markdown-body ol {
            margin-left: 20px;
            margin-bottom: 16px;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }

        .markdown-body code {
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .markdown-body pre {
            background: rgba(15, 23, 42, 0.9);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        .resource-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            margin-top: 16px;
            word-break: break-all;
        }

        .resource-link:hover {
            text-decoration: underline;
        }

        /* Empty state placeholder */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>OKF Explorer</h1>
            <div class="subtitle">Traverse and explore the knowledge graph</div>
            <input type="text" id="search" placeholder="Search concepts or tags...">
        </div>

        <div id="details">
            <div class="empty-state">
                <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.003 9.003 0 0 0-12 0M12 9.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5ZM12 12.75a6.75 6.75 0 0 0-6.75 6.75c0 .337.03.668.087 1h13.326a6.93 6.93 0 0 0 .087-1 6.75 6.75 0 0 0-6.75-6.75Z" />
                </svg>
                <p style="margin-top: 16px;">Select a node in the graph to inspect details and traverse links.</p>
            </div>
        </div>
    </div>

    <div id="graph-container"></div>

    <script>
        let cy;
        let graphData = { nodes: [], edges: [] };

        // Color mapper based on node type
        function getNodeColor(type) {
            type = type ? type.toLowerCase() : "";
            if (type.includes("dataset")) return "var(--color-dataset)";
            if (type.includes("table")) return "var(--color-table)";
            if (type.includes("metric")) return "var(--color-metric)";
            if (type.includes("reference")) return "var(--color-reference)";
            return "var(--color-default)";
        }

        // Initialize Cytoscape.js
        function initGraph(elements) {
            cy = cytoscape({
                container: document.getElementById('graph-container'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(title)',
                            'background-color': function(ele) { return getNodeColor(ele.data('type')); },
                            'color': '#f8fafc',
                            'font-family': 'Outfit, sans-serif',
                            'font-size': '13px',
                            'text-valign': 'bottom',
                            'text-margin-y': '6px',
                            'width': '35px',
                            'height': '35px',
                            'transition-property': 'background-color, width, height, border-color, border-width',
                            'transition-duration': '0.2s',
                            'overlay-padding': '4px',
                            'overlay-opacity': 0
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#475569',
                            'target-arrow-color': '#475569',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'arrow-scale': 0.8
                        }
                    },
                    {
                        selector: 'node:selected',
                        style: {
                            'border-width': '4px',
                            'border-color': 'var(--accent-color)',
                            'width': '42px',
                            'height': '42px'
                        }
                    }
                ],
                layout: {
                    name: 'cose',
                    animate: true,
                    randomize: true,
                    nodeRepulsion: function(node) { return 2048; },
                    idealEdgeLength: function(edge) { return 64; }
                }
            });

            // Handle Node Selection
            cy.on('tap', 'node', function(evt) {
                const node = evt.target;
                selectNode(node.data('id'));
            });
        }

        // Display node info in sidebar
        function selectNode(nodeId) {
            const node = graphData.nodes.find(n => n.data.id === nodeId);
            if (!node) return;

            // Highlight node in graph
            cy.$('node').unselect();
            const cyNode = cy.$id(nodeId);
            if (cyNode.length > 0) {
                cyNode.select();
                cy.animate({
                    center: { eles: cyNode },
                    zoom: 1.2
                }, { duration: 300 });
            }

            const data = node.data;
            const badgeClass = data.type ? `badge-${data.type.toLowerCase().replace(/ /g, '-')}` : 'badge-default';

            const detailsHTML = `
                <div class="detail-content">
                    <span class="meta-badge ${badgeClass}">${data.type || 'Concept'}</span>
                    <h2 class="concept-title">${data.title || data.id}</h2>
                    <p class="concept-desc">${data.description || 'No description provided.'}</p>
                    
                    ${data.resource ? `
                        <div class="section-title">Resource Link</div>
                        <a href="${data.resource}" target="_blank" class="resource-link">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                            ${data.resource}
                        </a>
                    ` : ''}

                    <div class="section-title" style="margin-top: 24px;">Body / Details</div>
                    <div class="markdown-body" id="body-container"></div>
                </div>
            `;

            document.getElementById('details').innerHTML = detailsHTML;
            document.getElementById('body-container').innerHTML = marked.parse(data.body || '');

            // Set up link interception for in-app graph traversal!
            setupLinkInterception(nodeId);
        }

        // Intercept relative markdown link clicks to traverse graph nodes dynamically
        function setupLinkInterception(currentNodeId) {
            const bodyContainer = document.getElementById('body-container');
            const links = bodyContainer.getElementsByTagName('a');

            for (let link of links) {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('http://') && !href.startsWith('https://')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // Resolve target relative path to Concept ID
                        const resolvedId = resolveRelativePath(currentNodeId, href);
                        console.log(`Traversing from ${currentNodeId} -> ${resolvedId}`);
                        
                        if (graphData.nodes.some(n => n.data.id === resolvedId)) {
                            selectNode(resolvedId);
                        } else {
                            alert(`Target concept "${resolvedId}" not found in this bundle.`);
                        }
                    });
                }
            }
        }

        // Helper to resolve relative path (e.g. "../tables/users.md" from "datasets/ga4") to Concept ID
        function resolveRelativePath(currentId, relativePath) {
            const cleanPath = relativePath.replace(/\.md$/, '');
            const currentParts = currentId.split('/');
            currentParts.pop(); // Remove the filename/leaf node

            const relativeParts = cleanPath.split('/');
            for (let part of relativeParts) {
                if (part === '..') {
                    currentParts.pop();
                } else if (part !== '.' && part !== '') {
                    currentParts.push(part);
                }
            }
            return currentParts.join('/');
        }

        // Search and Filter functionality
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!cy) return;

            if (query === "") {
                cy.elements().removeClass('filtered');
                return;
            }

            cy.elements().forEach(ele => {
                if (ele.isNode()) {
                    const title = (ele.data('title') || '').toLowerCase();
                    const id = ele.data('id').toLowerCase();
                    const tags = (ele.data('tags') || []).join(' ').toLowerCase();

                    if (title.includes(query) || id.includes(query) || tags.includes(query)) {
                        ele.removeClass('filtered');
                    } else {
                        ele.addClass('filtered');
                    }
                }
            });
        });

        // Fetch graph payload from Go API on startup
        fetch('/api/graph')
            .then(res => res.json())
            .then(data => {
                graphData = data;
                
                // Format for Cytoscape (nodes and edges)
                const elements = [];
                data.nodes.forEach(n => elements.push(n));
                data.edges.forEach(e => elements.push(e));

                initGraph(elements);
            })
            .catch(err => {
                console.error("Failed to load graph data", err);
                document.getElementById('details').innerHTML = `
                    <div style="color: var(--color-reference); padding: 16px;">
                        <h3>Error</h3>
                        <p>Failed to load graph data. Make sure the backend server is running and returning /api/graph.</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
